[package]
name = "devin-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Generated Devin protobuf/ConnectRPC message bindings"

[dependencies]
buffa.workspace = true
buffa-types.workspace = true
connectrpc.workspace = true
serde.workspace = true

# Codegen runs via `cargo run -p devin-proto --example generate`
# (scripts/generate-proto.sh); generated sources are checked in, so this is
# a dev-only dependency, never needed by normal builds. buffa-descriptor
# validates the original descriptors.pb in tests; serde_json parses the Go
# protojson fixture oracle.
[dev-dependencies]
connectrpc-build.workspace = true
buffa-descriptor = { version = "0.9", features = ["reflect"] }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
