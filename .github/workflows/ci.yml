name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # Workspace lints deny warnings; pedantic policy lives in Cargo.toml.
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # Oracle-dependent tests skip when the Go reference checkout is absent;
      # everything else must pass on a clean clone.
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked --bins

  proto:
    name: Proto regen check
    runs-on: ubuntu-latest
    # devin-proto codegen compiles ~82MB of generated Rust; allow headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # Checked-in bindings must equal a fresh regeneration from
      # proto/all-protos.fds; drift fails here instead of at review time.
      - run: scripts/generate-proto.sh --check

  license:
    name: License notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THIRD_PARTY_NOTICES.md must cover exactly the locked third-party set.
      - run: bash scripts/check-licenses.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh

  # Deploy/release asset regression gate (Go CI parity): plist/unit field
  # assertions plus the offline release.sh dry-run/publish rehearsal.
  deploy-assets:
    name: Deploy assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy-assets.test.sh
      - run: bash scripts/release-selftest.sh

  # Six-target build matrix — the same contract release.yml publishes.
  # Native hosted runners where the platform SDK is required (Darwin needs
  # Xcode, so Intel builds on macos-15-intel and Silicon on macos-15);
  # aarch64-pc-windows-msvc cross-builds on the x64 Windows image because no
  # hosted arm64 Windows runner exists — its execution smoke is unavailable
  # and explicitly labeled below.
  targets:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-musl, asset: devin-2api-linux-amd64,       kind: binary,      smoke: native }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: devin-2api-linux-arm64,       kind: binary,      smoke: native }
          - { runner: macos-15-intel,   target: x86_64-apple-darwin,        asset: devin-2api-darwin-amd64,      kind: binary,      smoke: native }
          - { runner: macos-15,         target: aarch64-apple-darwin,       asset: devin-2api-darwin-arm64,      kind: binary,      smoke: native }
          - { runner: windows-2025,     target: x86_64-pc-windows-msvc,     asset: devin-2api-windows-amd64.zip, kind: windows-zip, smoke: version }
          - { runner: windows-2025,     target: aarch64-pc-windows-msvc,    asset: devin-2api-windows-arm64.zip, kind: windows-zip, smoke: none }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build all binaries
        shell: bash
        run: cargo build --locked --release --target '${{ matrix.target }}' --bins

      - name: Package Unix binary
        if: matrix.kind == 'binary'
        shell: bash
        run: scripts/package-release.sh --target '${{ matrix.target }}' --binary 'target/${{ matrix.target }}/release/devin-2api'

      - name: Package Windows ZIP
        if: matrix.kind == 'windows-zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, package | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/devin-2api.exe' package/devin-2api.exe
          Copy-Item config.example.yaml, LICENSE package/
          Compress-Archive -Path package/devin-2api.exe,package/config.example.yaml,package/LICENSE -DestinationPath 'dist/${{ matrix.asset }}'

      # musl release assets must not declare a program interpreter; a
      # PT_INTERP header means a dynamic dependency slipped in and the
      # binary would not run on alpine/scratch.
      - name: Assert static Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if readelf -l 'dist/${{ matrix.asset }}' | grep -q 'Requesting program interpreter'; then
            echo 'Linux release binary has a dynamic interpreter' >&2
            exit 1
          fi

      - name: Smoke (native runner)
        if: matrix.smoke == 'native'
        shell: bash
        run: scripts/smoke.sh --no-upstream --config config.example.yaml --port 18099 --binary 'target/${{ matrix.target }}/release/devin-2api'

      - name: Smoke (Windows amd64, native)
        if: matrix.smoke == 'version'
        shell: pwsh
        run: |
          & 'target/${{ matrix.target }}/release/devin-2api.exe' -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Cross-built arm64 Windows binary cannot execute on the x64 runner and
      # no hosted arm64 Windows runner exists — execution is unverified.
      - name: Smoke unavailable (cross-built arm64)
        if: matrix.smoke == 'none'
        shell: pwsh
        run: Write-Host 'aarch64-pc-windows-msvc is cross-built on windows-2025 x64; execution smoke unavailable (no hosted arm64 Windows runner).'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1
