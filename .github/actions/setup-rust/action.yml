name: Setup Rust
description: >-
  Install the pinned rust-toolchain.toml toolchain (rustfmt + clippy
  components), optionally add cross targets, and cache cargo artifacts.
inputs:
  targets:
    description: Extra rustup targets to install (comma-separated)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # rustup 1.28+ auto-installs the toolchain named by rust-toolchain.toml
    # (channel 1.98.1 + rustfmt/clippy components) on first invocation;
    # `rustup show` forces that resolution up front so failures surface here.
    - name: Install pinned toolchain
      shell: bash
      run: rustup show

    - name: Add cross targets
      if: ${{ inputs.targets != '' }}
      shell: bash
      run: rustup target add '${{ inputs.targets }}'

    # devin-proto is ~82MB of generated Rust; a single rustc invocation
    # peaks at ~16GB RSS, which meets the 16GB hosted-runner RAM ceiling
    # head-on (parallel rustc instances OOM -> "runner shutdown" SIGTERM).
    # A swapfile on the root disk gives the compile headroom to survive.
    - name: Add swap for devin-proto compile (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo fallocate -l 16G /devin2api.swap || sudo dd if=/dev/zero of=/devin2api.swap bs=1M count=16384
        sudo chmod 600 /devin2api.swap
        sudo mkswap /devin2api.swap
        sudo swapon /devin2api.swap
        free -h

    - name: Cache cargo artifacts
      uses: swatinem/rust-cache@v2

    - name: Verify toolchain
      shell: bash
      run: rustc -vV && cargo --version
